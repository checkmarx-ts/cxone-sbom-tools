name: Bug report
description: Create a bug report to help us improve
title: "bug(<scope>): <title starting with lowercase letter>"
labels: ["community", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please make sure to:**
        - Describe in details what the problem is
        - Attach a log file with relevant data preferably in DEBUG level
        - When attaching files to the issue make sure they are properly formatted
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Which results are expected?
      placeholder: Describe what you expected to happen
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Formatted logs and samples helps us to better understand the issue
      placeholder: Describe what actually happened
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce the Problem
      description: Command line arguments and flags used
      placeholder: |
        1. step 1
        2. step 2
        3. step 3
    validations:
      required: true
  
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability report
          required: true