name: CI
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 3 * * 1'
    
permissions:
  contents: read

jobs:

  linting:
      runs-on: cx-public-ubuntu-x64
      strategy:
        max-parallel: 3
        matrix:
          pver:
            - "3.10"
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
      steps:
        - name: Fetch Code
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

        - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
          with:
            python-version: ${{ matrix.pver }}

        - name: Install Pylint
          shell: bash
          run: |
            pip config set global.index-url https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@pypi.echohq.com/simple
            pip install pylint .

        - name: Pylint
          shell: bash
          run: |
            pylint --disable=all --enable=E,F --disable=E1121 --score=false src

  execute-unit-tests:
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          pip config set global.index-url https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@pypi.echohq.com/simple
          pip install pytest .

      - name: Execute Unit Tests
        run: |
          . .env
          python -m unittest discover -v -p test_*.py -s ${{ github.workspace }}/tests


  execute-cli-smoke-tests:
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          pip config set global.index-url https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@pypi.echohq.com/simple
          pip install .[cli]

      - name: Execute help
        run: |
          cxone-sbom-tools -h

      - name: Verify embedded public key signature of cyclonedx.signed.example.json (expect exit 254, valid but untrusted)
        shell: bash
        run: |
          rc=0; cxone-sbom-tools verify --key testdata/sbom/cyclonedx.signed.example.json || rc=$?; [ "$rc" -eq 254 ] || { echo "::error::verify --key returned exit code $rc, expected 254"; exit 1; }

      - name: ecp521 sign with bundle.pem (unencrypted cert+key bundle) --hash 256, verify --signer bundle.pem (expect sign 0, verify 254)
        shell: bash
        run: |
          d=testdata/certs/simple/ecp521_sha512; out=signed.ecp521.bundle.sha256.signer.json; st=0; ( rc=0; cxone-sbom-tools sign --cert "$d/bundle.pem" --hash 256 testdata/sbom/sbom.json "$out" || rc=$?; [ "$rc" -eq 0 ] || { echo "::error::sign returned exit code $rc, expected 0"; exit 1; }; [ -f "$out" ] || { echo "::error::signed SBOM $out was not produced"; exit 1; }; jq -e 'has("signature")' "$out" > /dev/null || { echo "::error::signed SBOM $out has no signature element"; exit 1; }; rc=0; cxone-sbom-tools verify --signer "$d/bundle.pem" "$out" || rc=$?; [ "$rc" -eq 254 ] || { echo "::error::verify --signer bundle.pem returned exit code $rc, expected 254"; exit 1; } ) || st=$?; rm -f "$out"; [ ! -e "$out" ] || { echo "::error::signed SBOM $out was not removed"; exit 1; }; [ "$st" -eq 0 ] || exit "$st"; echo "PASS: sign with bundle.pem --hash 256 exited 0 with signature element; verify --signer bundle.pem exited 254; $out removed"

      - name: ecp521 sign with bundle.pem (unencrypted cert+key bundle) --hash 256, verify --embedded (expect sign 0, verify 254)
