[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cxone-sbom-tools"
readme = "README.md"
dynamic = ["version"]
dependencies = [
  "cryptography>=50.0.2",
  "PyJWT>=2.15.0",
  "dataclasses-json>=0.6.7",
  "joserfc>=1.7.5",
  "aenum>=3.1.17",
  "rfc8785>=0.1.4"
]

description = "CheckmarxOne SBOM Tools"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/checkmarx-ts/cxone-sbom-tools"
Repository = "https://github.com/checkmarx-ts/cxone-sbom-tools"
Documentation = "https://github.com/checkmarx-ts/cxone-sbom-tools/releases/latest/download/cxone-sbom-tools-skill.zip"

[project.scripts]
cxone-sbom-tools = "cxone_sbom.__main__:main"

[tool.setuptools]
package-dir = {"cxone_sbom" = "src/cxone_sbom"}

[tool.setuptools.dynamic]
version = { attr = "cxone_sbom.__version__" }

[project.optional-dependencies]
cli = ["docopt-ng==0.9.0"]

[tool.pydoc-markdown]
loaders = [
  { type = "python", search_path = ["./src"], packages = ["cxone_sbom"]}
]

processors = [
  { type = "filter", skip_empty_modules = true, documented_only=true },
]

[tool.pydoc-markdown.renderer]
type = "markdown"
filename = "ai/skills/cxone-sbom-tools/references/cxone-sbom-tools-docs.md"
